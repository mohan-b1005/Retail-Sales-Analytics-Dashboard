<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retail Sales Intelligence Dashboard</title><style>body{margin:0;background:#f4f7fb;font-family:Segoe UI,Arial,sans-serif}.l{min-height:100vh;display:grid;place-items:center;color:#0a2540;font-weight:700}.s{font-size:12px;color:#64748b;margin-top:8px;text-align:center}</style></head><body><div id="loading" class="l"><div>Loading Retail Sales Intelligence…<div class="s">Client-side analytics · secure static delivery</div></div></div><script>(async()=>{try{let b='';for(let i=1;i<=5;i++)b+=await(await fetch('c'+i+'.txt',{cache:'no-store'})).text();const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const t=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()}catch(e){document.getElementById('loading').innerHTML='<div>Unable to load dashboard.<div class="s">Please refresh in a current version of Chrome or Edge.</div></div>';console.error(e)}})();</script></body></html>
